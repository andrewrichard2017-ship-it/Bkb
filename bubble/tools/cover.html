<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bubble Odyssey cover</title>
<!-- Store cover art, drawn with the game's own backgrounds and bubbles. tools/covers.js (repo root) screenshots it:
     cover.html?w=1920&h=1080&world=candy. Serve the repo over http, it doesn't work from file://. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=block">
<style>
  html, body { margin: 0; overflow: hidden; background: #120a33; }
  #wrap { position: relative; }
  canvas { display: block; }
  .logo { position: absolute; transform: translate(-50%, -50%); margin: 0; line-height: .9; text-align: center; font-family: "Fredoka", Arial, sans-serif; white-space: nowrap; }
  .logo .l1 { display: flex; justify-content: center; gap: .02em; font-weight: 700; }
  .logo .l1 i { font-style: normal; display: inline-block; background: linear-gradient(180deg, #fff 0%, #9fe8ff 30%, #4f9dff 60%, #8a4fff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: .028em #fff; paint-order: stroke fill; filter: drop-shadow(0 .06em 0 #2a1470) drop-shadow(0 .1em .16em rgba(0,0,0,.55)); }
  .logo .l2 { display: block; font-weight: 700; letter-spacing: .18em; padding-left: .18em; color: #ffe14f; -webkit-text-stroke: .05em #6a3a00; paint-order: stroke fill; text-shadow: 0 .09em 0 #6a3a00, 0 .16em .4em rgba(0,0,0,.5); margin-top: .12em; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas><h1 class="logo" id="logo"><span class="l1"></span><span class="l2">ODYSSEY</span></h1></div>
<script src="../js/core.js"></script>
<script src="../js/board.js"></script>
<script src="../js/levels.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/bg.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080), world = q.get('world') || 'candy';
  const u = Math.min(W, H), wide = W / H > 1.3, tall = H / W > 1.3, TAU = Math.PI * 2;
  const cv = document.getElementById('cv'), c = cv.getContext('2d');
  cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  document.getElementById('wrap').style.cssText = `width:${W}px;height:${H}px`;
  const rnd = BB.rng(+(q.get('seed') || 7));
  const S = BB.sprites, P = BB.SPRITE_PAD, K = BB.K;

  // where things go: the logo, the big Blip, and how big the ceiling bubbles are
  const L = wide ? { lx: 0.33, ly: 0.56, ls: 0.2 * H, hx: 0.76, hy: 0.62, hr: 0.2 * H, r: 0.052 * H }
    : tall ? { lx: 0.5, ly: 0.47, ls: 0.205 * W, hx: 0.5, hy: 0.77, hr: 0.2 * W, r: 0.058 * W }
    : { lx: 0.5, ly: 0.45, ls: 0.17 * W, hx: 0.5, hy: 0.77, hr: 0.15 * W, r: 0.05 * W };

  BB.bg.resize(W, H, 1); BB.bg.set(world); BB.bg.draw(c, 0);
  c.fillStyle = 'rgba(18,10,51,0.18)'; c.fillRect(0, 0, W, H);   // a touch darker so the art pops

  // pre-render the big Blip, then the board-sized bubbles (build() replaces the sprite sets)
  S.build(L.hr, false); const hero = S.crit[1][0];
  S.build(L.r * 1.2, false); const mid = { color: S.color.slice(), crit: S.crit.map(x => x[0]), star: S.star, bomb: S.bomb, rainbow: S.rainbow };
  S.build(L.r, false);
  const stamp = (img, x, y, r, a = 1) => { const s = r * P; c.globalAlpha = a; c.drawImage(img, x - s, y - s, s * 2, s * 2); c.globalAlpha = 1; };

  // the ceiling: a ragged hex grid of bubbles in clumps, with a few trapped Blips and specials
  const r = L.r, dx = r * 2, dy = r * Math.sqrt(3), cols = Math.ceil(W / dx) + 1;
  const rows = tall ? 4 : wide ? 4 : 3, cells = [];
  let prev = [];
  for (let row = 0; row < rows + 2; row++) {
    const line = [];
    for (let col = 0; col < cols; col++) {
      const x = col * dx + (row % 2 ? r : 0) - r * 0.4, y = r * 0.9 + row * dy;
      const depth = rows - 0.6 + Math.sin(col * 0.55 + 1.3) * 1.1 + Math.sin(col * 1.7) * 0.6;
      if (row > depth) { line.push(-1); continue; }
      const near = col > 0 && line[col - 1] >= 0 ? line[col - 1] : prev[col] >= 0 ? prev[col] : -1;
      const color = near >= 0 && rnd() < 0.6 ? near : Math.floor(rnd() * 6);
      line.push(color); cells.push({ x, y, color, row });
    }
    prev = line;
  }
  // keep the logo and the burst clear
  cells.forEach((cell, i) => {
    const roll = rnd();
    cell.k = roll < 0.07 ? K.CRIT : roll < 0.085 ? K.STAR : roll < 0.1 ? K.BOMB : K.N;
  });
  // a gap the shot is about to fill, and a burst where a match just popped
  const target = cells.filter(cl => cl.row === rows - 1 && cl.x > W * (wide ? 0.52 : 0.25) && cl.x < W * (wide ? 0.68 : 0.45))[0] || cells[cells.length - 1];
  const burst = { x: target.x + dx * 1.5, y: target.y + dy * 0.4 };
  const popped = cells.filter(cl => Math.hypot(cl.x - burst.x, cl.y - burst.y) < r * 2.4 && cl.row >= rows - 2);
  for (const cl of popped) cl.gone = true;
  target.gone = true;

  for (const cl of cells) {
    if (cl.gone) continue;
    const img = cl.k === K.CRIT ? S.crit[cl.color][0] : cl.k === K.STAR ? S.star : cl.k === K.BOMB ? S.bomb : S.color[cl.color];
    stamp(img, cl.x, cl.y, r);
  }

  // the pop: a ring, sparkles and falling pieces in the popped colour
  const popCol = BB.PAL[popped.length ? popped[0].color : 2];
  const sparkle = (x, y, s, col) => {
    c.save(); c.translate(x, y); c.fillStyle = col; c.shadowColor = col; c.shadowBlur = s * 1.5;
    c.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? s * 0.22 : s; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.closePath(); c.fill(); c.restore();
  };
  c.save(); c.strokeStyle = BB.rgba(popCol.light, 0.85); c.lineWidth = r * 0.16; c.shadowColor = popCol.glow; c.shadowBlur = r * 0.6;
  c.beginPath(); c.arc(burst.x, burst.y, r * 1.9, 0, TAU); c.stroke(); c.restore();
  for (let i = 0; i < 16; i++) { const a = rnd() * TAU, d = r * (1.2 + rnd() * 2.2); sparkle(burst.x + Math.cos(a) * d, burst.y + Math.sin(a) * d, r * (0.18 + rnd() * 0.3), i % 3 ? '#fff6c8' : popCol.light); }
  popped.forEach((cl, i) => { const a = -0.5 + i * 0.9; stamp(mid.color[cl.color], cl.x + Math.cos(a) * r * 1.4, cl.y + r * (1.6 + i * 0.5), r * (0.55 - i * 0.04), 0.9); });

  // the shot: an aim guide from the big Blip up to the gap, and a bubble on its way
  const hx = L.hx * W, hy = L.hy * H;
  const sx = hx - L.hr * (wide ? 0.55 : 0.45), sy = hy - L.hr * 0.95, tx = target.x, ty = target.y;
  const shotCol = popped.length ? popped[0].color : 1;
  c.save(); c.fillStyle = 'rgba(255,255,255,0.75)';
  const n = Math.floor(Math.hypot(tx - sx, ty - sy) / (r * 0.55));
  for (let i = 2; i < n - 1; i++) { const t = i / n; c.beginPath(); c.arc(sx + (tx - sx) * t, sy + (ty - sy) * t, r * 0.11 * (1 - t * 0.4), 0, TAU); c.fill(); }
  c.restore();
  const ft = wide ? 0.62 : 0.86, fx = sx + (tx - sx) * ft, fy = sy + (ty - sy) * ft;
  for (let i = 1; i <= 6; i++) { const t = ft - i * 0.03; c.save(); c.globalAlpha = 0.12 * (7 - i) / 6; c.fillStyle = BB.PAL[shotCol].glow; c.beginPath(); c.arc(sx + (tx - sx) * t, sy + (ty - sy) * t, r * (1 - i * 0.08), 0, TAU); c.fill(); c.restore(); }
  stamp(mid.color[shotCol], fx, fy, r * 1.05);

  // the big Blip in its bubble, with a glow behind it and a couple of friends
  const glow = c.createRadialGradient(hx, hy, 0, hx, hy, L.hr * 1.9);
  glow.addColorStop(0, 'rgba(255,240,200,0.55)'); glow.addColorStop(1, 'rgba(255,240,200,0)');
  c.fillStyle = glow; c.fillRect(hx - L.hr * 2, hy - L.hr * 2, L.hr * 4, L.hr * 4);
  stamp(hero, hx, hy, L.hr);
  stamp(mid.color[1], hx + L.hr * 1.15, hy + L.hr * 0.55, L.hr * 0.36);
  stamp(mid.rainbow, hx - L.hr * 1.2, hy + L.hr * 0.62, L.hr * 0.3);
  stamp(mid.color[3], hx + L.hr * 0.95, hy - L.hr * 0.8, L.hr * 0.24);
  for (let i = 0; i < 7; i++) { const a = rnd() * TAU, d = L.hr * (1.25 + rnd() * 0.5); sparkle(hx + Math.cos(a) * d, hy + Math.sin(a) * d, L.hr * (0.05 + rnd() * 0.06), '#fff6c8'); }

  // the logo, as on the title screen
  const logo = document.getElementById('logo');
  logo.querySelector('.l1').innerHTML = 'BUBBLE'.split('').map((ch, i) => `<i style="transform:translateY(${i % 2 ? -0.04 : 0.03}em) rotate(${i % 2 ? 3 : -3}deg)">${ch}</i>`).join('');
  logo.style.left = L.lx * W + 'px'; logo.style.top = L.ly * H + 'px';
  logo.querySelector('.l1').style.fontSize = L.ls + 'px';
  logo.querySelector('.l2').style.fontSize = L.ls * 0.52 + 'px';
  await document.fonts.ready;
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
