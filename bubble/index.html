<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120a33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Bubble Odyssey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
  :root { color-scheme: dark; --ink: #ffffff; --dim: rgba(255,255,255,.72); --acc: #ffe14f; --pink: #ff4f8b; --blue: #4fc3ff; --grn: #7dff9a; --bg: #120a33;
    --panel: rgba(22,14,58,.84); --line: rgba(255,255,255,.18); --font: "Fredoka", "Arial Rounded MT Bold", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; font-family: var(--font);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3a1f7a, #120a33 70%); font: 700 clamp(26px, 5vw, 44px) var(--font); color: var(--acc); z-index: 50; text-align: center; }

  /* ---------------- menus ---------------- */
  #menu { position: fixed; inset: 0; display: none; z-index: 20; overflow-y: auto; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  #menu.show { display: grid; }
  #menu.center { place-items: center; }
  #menu.dim { background: rgba(5,2,20,.55); }
  #menu.full { padding: 0; overflow: hidden; }
  button { font-family: var(--font); }
  .mi { font: 600 clamp(16px, 2.3vw, 20px)/1.15 var(--font); letter-spacing: .02em; color: var(--ink); text-align: left; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(180deg, rgba(64,44,140,.92), rgba(32,20,84,.92)); border: 2px solid rgba(255,255,255,.26); border-radius: 16px; padding: 12px 18px;
    box-shadow: 0 4px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .08s, background .12s, box-shadow .12s; }
  .mi small { display: block; font-size: 13px; font-weight: 500; opacity: .8; margin-top: 2px; letter-spacing: 0; }
  .mi:hover { background: linear-gradient(180deg, rgba(84,60,170,.95), rgba(44,28,108,.95)); }
  .mi:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .mi.primary { background: linear-gradient(180deg, #ff7aa8, #ff4f8b 55%, #e0306e); border-color: #ffc0d6; box-shadow: 0 5px 0 #9a1748, 0 10px 24px rgba(255,79,139,.35); }
  .mi.danger { background: linear-gradient(180deg, #ff7a6a, #d63a2a); border-color: #ffc4b8; }
  .mi.focus { outline: none; border-color: #fff6b0; box-shadow: 0 0 0 3px var(--acc), 0 0 28px rgba(255,225,79,.55), 0 4px 0 rgba(0,0,0,.3); transform: scale(1.03); }
  .mi[disabled] { opacity: .4; cursor: default; filter: grayscale(.5); }
  .mi.icon { padding: 8px 14px; font-size: 20px; text-align: center; min-width: 46px; }
  .mi.half { flex: 1; text-align: center; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .row.tight { margin-top: 0; }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 24px; padding: clamp(16px, 3vw, 28px); width: min(560px, 100%);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.15); }
  .panel.wide { width: min(980px, 100%); }
  .panel.small-panel { width: min(380px, 100%); }
  .hdr { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .hdr h2 { margin: 0; font: 700 clamp(28px, 5vw, 42px)/1 var(--font); color: var(--acc); text-shadow: 0 3px 0 #6a3a00, 0 6px 20px rgba(0,0,0,.4); letter-spacing: .02em; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips span { font-weight: 600; font-size: 15px; padding: 5px 12px; border-radius: 20px; background: rgba(255,255,255,.12); }
  .sub { color: var(--dim); font-size: 17px; margin: 8px 0 12px; line-height: 1.35; font-weight: 500; }
  .sub.small { font-size: 14px; } .sub.center { text-align: center; }
  .tips { font-size: 16px; color: var(--dim); line-height: 1.4; padding-left: 20px; font-weight: 500; margin: 6px 0 12px; }
  .tips b { color: var(--ink); font-weight: 600; }
  .coin { white-space: nowrap; }
  .ico { width: 34px; height: 34px; object-fit: contain; vertical-align: middle; }
  .ico.big { width: 58px; height: 58px; }

  /* title */
  .title { text-align: center; max-width: 520px; width: 100%; }
  .logo { margin: 0 0 6px; line-height: .9; }
  .logo .l1 { display: flex; justify-content: center; gap: .02em; font: 700 clamp(54px, 13vw, 112px)/1 var(--font); }
  .logo .l1 i { font-style: normal; display: inline-block; background: linear-gradient(180deg, #fff 0%, #9fe8ff 30%, #4f9dff 60%, #8a4fff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px #fff; paint-order: stroke fill; filter: drop-shadow(0 6px 0 #2a1470) drop-shadow(0 12px 22px rgba(0,0,0,.5)); animation: bob 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * .14s); }
  .logo .l2 { display: block; font: 700 clamp(30px, 7vw, 58px)/1 var(--font); letter-spacing: .18em; color: var(--acc); -webkit-text-stroke: 2px #6a3a00; paint-order: stroke fill; text-shadow: 0 4px 0 #6a3a00, 0 8px 20px rgba(0,0,0,.5); margin-top: 6px; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  .tag { margin: 10px 0 18px; font-size: clamp(15px, 2.4vw, 19px); color: #fff; font-weight: 600; text-shadow: 0 2px 4px rgba(20,6,60,.9), 0 0 12px rgba(20,6,60,.6); }
  .menu-col { max-width: 420px; margin: 0 auto; }
  .menu-col > .mi { text-align: center; }
  .foot { margin-top: 16px; font-size: 14px; color: #fff; font-weight: 600; text-shadow: 0 1px 3px rgba(20,6,60,.95); }
  .pad.on { color: var(--grn); }

  /* career map */
  .map { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .mapbar { display: flex; align-items: center; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 14px 10px; background: linear-gradient(180deg, rgba(14,8,40,.92), rgba(14,8,40,.7)); border-bottom: 2px solid var(--line); z-index: 2; }
  .mapbar h2 { margin: 0; flex: 1; font: 700 clamp(20px, 4vw, 30px) var(--font); color: var(--acc); text-shadow: 0 2px 0 #6a3a00; }
  .mapscroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
  .world { position: relative; height: 1020px; max-width: 640px; margin: 0 auto; border-left: 2px solid rgba(255,255,255,.08); border-right: 2px solid rgba(255,255,255,.08); }
  .w-meadow { background: linear-gradient(180deg, rgba(120,220,120,.18), rgba(60,160,80,.32)); }
  .w-reef { background: linear-gradient(180deg, rgba(40,170,230,.2), rgba(10,70,140,.38)); }
  .w-candy { background: linear-gradient(180deg, rgba(255,150,220,.22), rgba(170,110,255,.3)); }
  .w-caves { background: linear-gradient(180deg, rgba(90,50,170,.28), rgba(25,12,60,.45)); }
  .w-nebula { background: linear-gradient(180deg, rgba(160,60,255,.22), rgba(20,8,60,.45)); }
  .trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .trail path { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 16; vector-effect: non-scaling-stroke; }
  .deco { position: absolute; opacity: .6; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
  .wname { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); width: min(92%, 440px); text-align: center; background: rgba(14,8,40,.7); border: 2px solid var(--line); border-radius: 18px; padding: 10px 14px; }
  .wname b { display: block; font: 700 21px var(--font); color: var(--acc); }
  .wname small { display: block; color: var(--dim); font-size: 14px; margin-top: 2px; }
  .wname span { display: inline-block; margin-top: 6px; font-weight: 600; font-size: 14px; padding: 2px 10px; border-radius: 12px; background: rgba(255,255,255,.12); }
  .node { position: absolute; transform: translate(-50%, -50%); width: 66px; height: 66px; border-radius: 50%; padding: 0; text-align: center; display: grid; place-items: center;
    background: radial-gradient(circle at 34% 30%, #fff 0, #9fe8ff 14%, #3f8cff 52%, #1a2a9a 100%); border: 3px solid rgba(255,255,255,.8); box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 10px 20px rgba(0,0,0,.35); }
  .node b { font: 700 24px/1 var(--font); text-shadow: 0 2px 0 rgba(0,0,40,.6); }
  .node em { position: absolute; top: -8px; right: -8px; font: 700 13px/1 var(--font); font-style: normal; background: #ff4f8b; border-radius: 10px; padding: 3px 6px; border: 2px solid #fff; }
  .node .nstars { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 15px; letter-spacing: .05em; text-shadow: 0 1px 2px #000; }
  .node.done { background: radial-gradient(circle at 34% 30%, #fff 0, #fff3a8 14%, #ffb13b 52%, #b0560a 100%); }
  .node.current { animation: pulse 1.3s ease-in-out infinite; }
  .node.locked { background: radial-gradient(circle at 34% 30%, #ddd 0, #8a8aa0 40%, #3a3a50 100%); border-color: rgba(255,255,255,.35); opacity: 1; filter: none; }
  .node.locked b { opacity: .75; }
  .node .lk { position: absolute; bottom: -6px; right: -6px; font-style: normal; font-size: 18px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
  .node.boss { width: 86px; height: 86px; background: radial-gradient(circle at 34% 30%, #fff 0, #ffb0d8 14%, #d63a8a 50%, #5a1060 100%); }
  .node.boss b { font-size: 36px; }
  .node.boss.done { background: radial-gradient(circle at 34% 30%, #fff 0, #fff3a8 14%, #ff8a3b 52%, #8a2a0a 100%); }
  .node.focus { transform: translate(-50%, -50%) scale(1.12); }
  @keyframes pulse { 0%, 100% { box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 0 0 0 rgba(255,225,79,.7); } 50% { box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 0 0 14px rgba(255,225,79,0); } }
  .st { color: rgba(255,255,255,.28); } .st.on { color: var(--acc); }

  /* popups */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,2,20,.6); padding: 16px; z-index: 5; }
  .panel.pop { animation: popin .28s cubic-bezier(.3,1.5,.5,1) both; width: min(480px, 100%); }
  @keyframes popin { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .goal { display: flex; gap: 14px; align-items: center; margin: 10px 0; padding: 12px; border-radius: 16px; background: rgba(255,255,255,.07); }
  .goal b { display: block; font-size: 20px; font-weight: 600; }
  .goal small { display: block; color: var(--dim); font-size: 14px; margin-top: 3px; }
  .specials { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
  .specials span { display: flex; align-items: center; gap: 4px; padding: 3px 10px 3px 4px; border-radius: 20px; background: rgba(255,255,255,.1); font-size: 14px; font-weight: 500; }
  .specials .ico { width: 26px; height: 26px; }
  .tipline { color: #9fe8ff; }
  .bigstars { display: flex; justify-content: center; gap: 14px; margin: 8px 0 6px; font: 700 64px/1 var(--font); }
  .bigstars.small { font-size: 40px; margin: 4px 0; }
  .bigstars span { color: rgba(255,255,255,.15); }
  .results .bigstars span.on { color: var(--acc); animation: star .55s cubic-bezier(.3,1.7,.5,1) both; text-shadow: 0 0 26px rgba(255,225,79,.8), 0 4px 0 #8a5a00; }
  .bigstars.small span.on { color: var(--acc); text-shadow: 0 3px 0 #8a5a00; }
  @keyframes star { 0% { transform: scale(0) rotate(-120deg); } 100% { transform: scale(1) rotate(0); } }
  .results.lose .hdr h2 { color: #ff7a8a; text-shadow: 0 3px 0 #5a0a1a; }
  .pay div { display: flex; justify-content: space-between; gap: 12px; font-size: 19px; font-weight: 500; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .pay b { color: var(--grn); font-weight: 700; }
  .pay .gold, .pay .gold b { color: var(--acc); }

  /* shop */
  .shopgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; }
  .shopcard { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,.07); border: 2px solid var(--line); }
  .shopcard > div { flex: 1; }
  .shopcard b { display: block; font-size: 18px; font-weight: 600; }
  .shopcard small { display: block; color: var(--dim); font-size: 13px; line-height: 1.25; margin: 2px 0; }
  .shopcard em { font-style: normal; color: var(--acc); font-size: 14px; font-weight: 600; }
  .mi.buy { padding: 9px 12px; font-size: 16px; white-space: nowrap; }

  /* how to / online */
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 8px; }
  .howto h3 { font: 700 21px var(--font); margin: 6px 0 6px; color: var(--acc); }
  .howto table { border-collapse: collapse; width: 100%; font-size: 15px; margin-bottom: 10px; }
  .howto td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; color: var(--dim); }
  .howto td:first-child { width: 44px; }
  .howto td b { color: var(--ink); font-weight: 600; }
  .pcard { border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; background: rgba(255,255,255,.05); }
  .pcard h3 { margin: 0; font: 700 24px var(--font); }
  .pcard.p1 h3 { color: #ffd84a; } .pcard.p2 h3 { color: #4fe3ff; }
  .pcard small { display: block; color: var(--dim); font-size: 13px; font-weight: 600; margin-top: 2px; }
  .selector { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 240px; }
  .selector b { font-weight: 600; }
  .selector span { opacity: .6; }
  .selector.ro { padding: 12px 16px; border: 2px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.05); }
  .code { font: 700 clamp(54px, 11vw, 84px)/1 var(--font); letter-spacing: .14em; color: var(--acc); text-align: center; margin: 8px 0; text-shadow: 0 4px 0 #6a3a00; }
  .link, .codein { width: 100%; font: 500 16px var(--font); color: var(--ink); background: rgba(0,0,0,.35); border: 2px solid var(--line); padding: 10px 12px; border-radius: 12px; -webkit-user-select: text; user-select: text; }
  .codein { font: 700 44px var(--font); letter-spacing: .22em; text-align: center; text-transform: uppercase; }
  .status { color: #9fe8ff; font-size: 17px; font-weight: 600; min-height: 1.2em; }
  /* phones held sideways: a smaller logo and the buttons in two columns */
  @media (max-height: 560px) {
    .title { max-width: 680px; }
    .logo .l1 { font-size: 50px; } .logo .l2 { font-size: 26px; margin-top: 2px; }
    .tag { margin: 4px 0 10px; font-size: 14px; }
    .menu-col { display: grid; grid-template-columns: 1fr 1fr; max-width: 640px; gap: 8px; }
    .menu-col > .mi.primary { grid-column: span 2; }
    .menu-col .row.tight { display: contents; }
    .mi { padding: 9px 14px; }
    .foot { margin-top: 8px; }
    .panel { padding: 14px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu"></div>
<div id="loading">BUBBLE ODYSSEY…</div>
<script src="js/core.js?v=1"></script>
<script src="js/board.js?v=1"></script>
<script src="js/levels.js?v=1"></script>
<script src="js/game.js?v=1"></script>
<script src="js/sprites.js?v=1"></script>
<script src="js/fx.js?v=1"></script>
<script src="js/bg.js?v=1"></script>
<script src="js/render.js?v=1"></script>
<script src="js/audio.js?v=2"></script>
<script src="js/input.js?v=1"></script>
<script src="js/ads.js?v=1"></script>
<script src="js/net.js?v=2"></script>
<script src="js/menu.js?v=2"></script>
<script src="js/main.js?v=2"></script>
</body>
</html>
