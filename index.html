<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120f0e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Bare Knuckle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
  :root { color-scheme: dark; --arena: #120f0e; --bone: #efe6d2; --brass: #d9a441; }
  html, body { height: 100%; margin: 0; background: var(--arena); color: var(--bone); overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #rotate { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px;
    background: var(--arena); font: 600 22px "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 0.04em; }
  #rotate b { display: block; font: 400 44px "Anton", Impact, sans-serif; color: var(--brass); letter-spacing: 0.02em; }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: grid; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Bare knuckle boxing game"></canvas>
<div id="rotate"><div><b>TURN YOUR PHONE</b>The fight plays in landscape.</div></div>
<script src="js/core.js?v=8"></script>
<script src="js/audio.js?v=8"></script>
<script src="js/looks.js?v=8"></script>
<script src="js/fx.js?v=8"></script>
<script src="js/rig.js?v=8"></script>
<script src="js/fighter.js?v=8"></script>
<script src="js/referee.js?v=8"></script>
<script src="js/replay.js?v=8"></script>
<script src="js/arena.js?v=8"></script>
<script src="js/yard.js?v=8"></script>
<script src="js/ai.js?v=8"></script>
<script src="js/gamepad.js?v=8"></script>
<script src="js/input.js?v=8"></script>
<script src="js/getup.js?v=8"></script>
<script src="js/corner.js?v=8"></script>
<script src="js/walkout.js?v=8"></script>
<script src="js/hud.js?v=8"></script>
<script src="js/game.js?v=8"></script>
</body>
</html>
