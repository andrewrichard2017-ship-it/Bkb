<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2f3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Bus Driver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Fredoka:wght@500;600;700&display=swap">
<style>
  :root { color-scheme: light; --ink: #1f2937; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #23262f; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; }
  button { font-family: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #view { position: relative; flex: 1 1 auto; min-height: 0; background: #9fd8ff; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #corner { position: absolute; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 8px; }
  .mini { width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); font-size: 20px; line-height: 1;
    box-shadow: 0 2px 6px rgba(0,0,0,.25); display: grid; place-items: center; padding: 0; color: var(--ink); }

  /* ---- dashboard ---- */
  #dash { flex: 0 0 auto; height: clamp(150px, 40vh, 250px); display: grid; grid-template-columns: 1fr auto 1fr; gap: clamp(8px, 2vw, 22px);
    padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    background: linear-gradient(#41475a, #23262f); border-top: 5px solid #14161c; touch-action: none; }
  .cluster { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: clamp(6px, 1.4vw, 12px); min-width: 0; min-height: 0; }
  .btn { --c: #64748b; position: relative; min-width: 0; min-height: 0; border: 0; border-radius: 18px; color: #fff; padding: 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: var(--c); font-weight: 700; font-size: clamp(12px, 2.6vh, 19px); line-height: 1; text-shadow: 0 1px 0 rgba(0,0,0,.3);
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 0 rgba(0,0,0,.4); transition: transform .06s; }
  .btn svg { width: clamp(22px, 7.5vh, 46px); height: clamp(22px, 7.5vh, 46px); flex: 0 0 auto; }
  .btn span { white-space: nowrap; }
  .btn:active, .btn.press { transform: translateY(3px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25), 0 1px 0 rgba(0,0,0,.4); }
  .btn::before { content: ""; position: absolute; top: 8px; left: 9px; width: 10px; height: 10px; border-radius: 50%; background: rgba(0,0,0,.28); }
  .btn.on::before { background: #c6ff5a; box-shadow: 0 0 8px 2px #c6ff5a; }
  .btn.hint, .btn.hint2 { animation: pulse .9s ease-in-out infinite; z-index: 1; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 0 rgba(0,0,0,.4), 0 0 0 0 rgba(255,255,255,0); }
    50% { transform: scale(1.07); box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 0 rgba(0,0,0,.4), 0 0 0 6px rgba(255,255,255,.85); }
  }
  .engine { --c: #f59e0b; } .stop { --c: #ef4444; } .go { --c: #16a34a; } .back { --c: #2563eb; }
  .door { --c: #0d9488; } .wipers { --c: #0284c7; } .radio { --c: #9333ea; }
  .radioCell { position: relative; display: grid; min-height: 0; }
  #bNext { position: absolute; right: -4px; top: -4px; width: clamp(30px, 8vh, 40px); height: clamp(30px, 8vh, 40px); border-radius: 50%;
    border: 3px solid #23262f; background: #fff; color: #7e22ce; display: none; place-items: center; padding: 0; z-index: 2; }
  #bNext svg { width: 60%; height: 60%; }
  .radio-on #bNext { display: grid; }

  /* steering wheel with the horn in the middle */
  #wheelWrap { position: relative; height: 100%; aspect-ratio: 1; display: grid; place-items: center; }
  #wheel { position: absolute; inset: 0; pointer-events: none; }
  #wheel svg { width: 100%; height: 100%; display: block; }
  #bHorn { position: relative; width: 44%; height: 44%; border-radius: 50%; border: 0; color: var(--ink); font-weight: 700;
    font-size: clamp(12px, min(3.4vh, 4.6vw), 24px); background: radial-gradient(circle at 40% 35%, #ffe066, #f59e0b);
    box-shadow: 0 4px 0 #b45309, inset 0 -3px 0 rgba(0,0,0,.18); }
  #bHorn:active, #bHorn.press { transform: translateY(3px); box-shadow: 0 1px 0 #b45309; }

  @media (orientation: portrait) {
    #dash { height: clamp(300px, 52vh, 520px); grid-template-columns: 1fr 1fr; grid-template-rows: 36% 1fr; grid-template-areas: "wheel wheel" "left right"; }
    #left { grid-area: left; } #right { grid-area: right; }
    #wheelWrap { grid-area: wheel; justify-self: center; }
    .btn { font-size: clamp(12px, 2vh, 19px); }
    .btn svg { width: clamp(24px, 5vh, 46px); height: clamp(24px, 5vh, 46px); }
  }

  /* ---- title ---- */
  #title { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; background: rgba(15, 50, 95, .35); }
  #title[hidden] { display: none; }
  .card { width: 100%; max-width: 540px; background: #fff; border-radius: 28px; text-align: center; color: var(--ink);
    padding: clamp(14px, 3.5vh, 30px) clamp(18px, 4vw, 36px); box-shadow: 0 10px 0 rgba(0,0,0,.18); }
  .card h1 { margin: 0; font-size: clamp(34px, 9vh, 64px); line-height: 1; color: #f59e0b; text-shadow: 0 3px 0 #b45309; }
  .card p { margin: clamp(4px, 1.2vh, 10px) 0; font-size: clamp(15px, 3vh, 20px); font-weight: 600; }
  #starLine { color: #b45309; }
  #swatches { display: flex; gap: 12px; justify-content: center; margin: clamp(4px, 1.2vh, 10px) 0 clamp(10px, 2.5vh, 18px); }
  .sw { width: clamp(56px, 13vh, 76px); padding: 6px; border-radius: 16px; border: 4px solid transparent; background: #f1f5f9; }
  .sw.sel { border-color: var(--ink); background: #fff7d6; }
  .sw svg { width: 100%; display: block; }
  #play { font-size: clamp(24px, 6vh, 36px); font-weight: 700; padding: .3em 1.6em; border-radius: 999px; border: 0; background: #22c55e; color: #fff;
    box-shadow: 0 6px 0 #15803d; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  #play:active { transform: translateY(4px); box-shadow: 0 2px 0 #15803d; }
  /* ---- go into school ---- */
  #goClass { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2; border: 0; border-radius: 999px;
    padding: .45em 1.3em; font-size: clamp(18px, 4.5vh, 28px); font-weight: 700; color: #fff; background: #2563eb;
    box-shadow: 0 5px 0 #1e3a8a; animation: nudge 1.1s ease-in-out infinite; white-space: nowrap; }
  #goClass[hidden] { display: none; }
  @keyframes nudge { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.08); } }

  /* ---- inside the school ---- */
  #school { position: fixed; inset: 0; z-index: 6; background: #cfe6f5; --pencil: #334155; --line: #bcd4ee; --margin: #f3a5a5; --paper: #fffef9;
    --hand: Andika, Fredoka, "Trebuchet MS", sans-serif; }
  #school[hidden], #school .screen[hidden] { display: none; }
  #school .screen { position: absolute; inset: 0; }
  #classCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .paper { position: absolute; left: 50%; bottom: max(3%, env(safe-area-inset-bottom)); width: min(600px, 92vw); max-height: 70%; overflow: auto;
    transform: translateX(-50%) rotate(-1.5deg); padding: 14px 18px 16px 52px; color: var(--pencil); border-radius: 4px;
    background: linear-gradient(90deg, transparent 38px, var(--margin) 38px 40px, transparent 40px),
      repeating-linear-gradient(var(--paper) 0 31px, var(--line) 31px 32px);
    box-shadow: 0 10px 24px rgba(60, 40, 10, .35); }
  .paper h2 { margin: 0 0 8px; font: 700 clamp(20px, 4.4vh, 30px)/1.1 var(--hand); color: #2563eb; }
  .tasks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .task { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 12px; text-align: left; border-radius: 14px;
    border: 3px dashed #94a3b8; background: rgba(255,255,255,.75); color: var(--pencil); font: 700 clamp(17px, 3.6vh, 24px)/1.05 var(--hand); }
  .task:active { transform: scale(.97); }
  .task .ico { font-size: 1.5em; line-height: 1; }
  .task small { display: block; font: 600 .7em/1.2 Fredoka, sans-serif; color: #64748b; }
  .task.main { border: 3px solid #f59e0b; background: #fff7d6; }
  .task.wide { grid-column: 1 / -1; min-height: 46px; justify-content: center; }
  @media (orientation: landscape) and (max-height: 500px) { .task { min-height: 48px; padding: 4px 12px; } .paper { max-height: 80%; padding-top: 8px; } }
  .wiggle { animation: wiggle .4s; color: #dc2626 !important; }
  @keyframes wiggle { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @media (orientation: portrait) { .tasks { grid-template-columns: 1fr; } .paper { max-height: 52%; } }

  /* name sheet */
  #traceScreen { display: flex; flex-direction: column; background: var(--paper);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #traceScreen[hidden] { display: none; }
  .topbar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
  .round { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; border: 0; background: #e2e8f0; color: var(--pencil); font-size: 22px; font-weight: 700; }
  #nameStrip { flex: 1; text-align: center; font: 700 clamp(26px, 6vh, 44px)/1 var(--hand); color: #cbd5e1; letter-spacing: .06em; }
  #nameStrip.nums span + span { margin-left: .6em; }
  #nameStrip .now { color: var(--pencil); text-decoration: underline 4px #f59e0b; text-underline-offset: 6px; }
  #traceWrap { position: relative; flex: 1 1 auto; min-height: 0; }
  #traceCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #soundCard { position: absolute; right: 4%; top: 6%; display: grid; justify-items: center; gap: 2px; padding: 12px 22px; border-radius: 22px;
    background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.2); border: 4px solid #fde68a; pointer-events: none; }
  #soundCard[hidden] { display: none; }
  #soundCard .pic { font-size: clamp(44px, 12vh, 90px); line-height: 1; }
  #soundCard .lt { font: 700 clamp(36px, 9vh, 70px)/1 var(--hand); }
  #soundCard .wd { font: 700 clamp(20px, 4.5vh, 32px)/1 var(--hand); color: var(--pencil); }
  #soundCard.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } }
  #crayons { flex: 0 0 auto; display: flex; justify-content: center; gap: clamp(6px, 2vw, 16px); padding: 6px 10px 12px; }
  #crayons[hidden] { display: none; }
  .crayon { width: clamp(30px, 9vw, 48px); height: clamp(50px, 12vh, 76px); border: 0; padding: 0; border-radius: 6px 6px 8px 8px;
    background: linear-gradient(var(--c) 0 0) bottom / 100% 78% no-repeat; clip-path: polygon(50% 0, 82% 22%, 100% 22%, 100% 100%, 0 100%, 0 22%, 18% 22%);
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); transform: translateY(14px); transition: transform .15s; }
  .crayon::after { content: ""; display: block; height: 22%; background: var(--c); clip-path: polygon(50% 0, 82% 100%, 18% 100%); }
  .crayon.sel { transform: translateY(0); }

  /* counting */
  #countRow { position: absolute; left: 0; right: 0; bottom: 4%; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; padding: 0 12px; pointer-events: none; }
  #countRow[hidden] { display: none; }
  .thing { position: relative; display: grid; justify-items: center; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  .thing .pic { font-size: clamp(34px, 9vh, 64px); line-height: 1.1; }
  .thing b { font: 700 clamp(16px, 3.6vh, 24px)/1 var(--hand); color: var(--pencil); }
  #countScreen { display: flex; flex-direction: column; background: #e0f2fe;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #countScreen[hidden] { display: none; }
  #countHead { flex: 1; text-align: center; display: grid; gap: 6px; justify-items: center; }
  #countPrompt { font: 700 clamp(20px, 4.6vh, 32px)/1.1 var(--hand); color: #1d4ed8; }
  #roundDots { display: flex; gap: 8px; }
  #roundDots i { width: 14px; height: 14px; border-radius: 50%; background: #bfdbfe; }
  #roundDots i.now { background: #f59e0b; } #roundDots i.done { background: #22c55e; }
  #countArea { flex: 1 1 auto; min-height: 0; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: clamp(6px, 2vh, 16px); padding: 8px 16px; overflow: auto; }
  #countArea .thing { border: 0; background: #fff; border-radius: 20px; padding: 6px 8px; min-width: 70px; box-shadow: 0 4px 0 #93c5fd; animation: none; }
  #countArea .thing canvas { width: 64px; height: 92px; display: block; }
  #countArea .thing b { position: absolute; top: -10px; right: -8px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: #f59e0b; color: #fff; font-size: 20px; animation: pop .3s cubic-bezier(.3, 1.6, .5, 1); }
  #countArea .thing.done { background: #fef3c7; box-shadow: 0 4px 0 #f59e0b; }
  #choices { flex: 0 0 auto; display: flex; justify-content: center; gap: clamp(12px, 4vw, 36px); padding: 4px 16px 18px; }
  #choices[hidden] { display: none; }
  .choice { width: clamp(70px, 20vw, 110px); height: clamp(70px, 17vh, 110px); border: 0; border-radius: 24px; background: #fff; color: var(--pencil);
    font: 700 clamp(40px, 10vh, 66px)/1 var(--hand); box-shadow: 0 6px 0 #60a5fa; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  .choice:disabled { opacity: .3; transform: scale(.9); }
  .choice.right { background: #22c55e; color: #fff; box-shadow: 0 6px 0 #15803d; }

  /* star book */
  #bookScreen { display: grid; place-items: center; align-content: center; gap: 14px; background: #7c3aed; padding: 16px; }
  #bookScreen[hidden] { display: none; }
  .book { display: grid; grid-template-columns: 1fr 1fr; width: min(720px, 94vw); max-height: 74vh; border-radius: 10px; padding: 10px;
    background: #b45309; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .book .page { background: var(--paper); padding: clamp(10px, 3vh, 24px); min-width: 0; }
  .book .left { border-radius: 6px 0 0 6px; display: grid; align-content: center; text-align: center; gap: 8px; box-shadow: inset -12px 0 16px -12px rgba(0,0,0,.35); }
  .book .left h2 { margin: 0; font: 700 clamp(22px, 5.5vh, 40px)/1.1 var(--hand); color: #b45309; text-wrap: balance; }
  .book .left p { margin: 0; font: 600 clamp(14px, 3vh, 20px)/1.3 Fredoka, sans-serif; color: var(--pencil); }
  #bookStars { border-radius: 0 6px 6px 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-content: center;
    box-shadow: inset 12px 0 16px -12px rgba(0,0,0,.35); }
  .slot svg { width: 100%; max-height: 13vh; display: block; fill: none; stroke: #e2e8f0; stroke-width: 2.5; stroke-dasharray: 4 3; }
  .slot { position: relative; }
  .slot i { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); font-style: normal; font-size: clamp(12px, 3vh, 20px); }
  .slot.got svg { fill: #fbbf24; stroke: #b45309; stroke-dasharray: none; }
  .slot.new svg { animation: stamp .7s cubic-bezier(.3, 1.5, .5, 1) .3s both; filter: drop-shadow(0 0 8px #fde68a); }
  @keyframes stamp { from { transform: scale(3) rotate(-90deg); opacity: 0; } }
  .bigBtn { border: 0; border-radius: 999px; padding: .4em 1.4em; font-size: clamp(18px, 4.4vh, 26px); font-weight: 700; color: #7c3aed; background: #fff; box-shadow: 0 5px 0 #4c1d95; }
  @media (orientation: portrait) { .book { grid-template-columns: 1fr; } .book .left, #bookStars { border-radius: 6px; box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { #goClass, .btn.hint, .btn.hint2, .slot.new svg, #soundCard.pop { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="game" aria-label="A bus driving down a street, picking up kids at bus stops"></canvas>
    <div id="corner">
      <button id="bMute" class="mini" aria-label="Sound on or off">🔊</button>
      <button id="bFull" class="mini" aria-label="Full screen">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      </button>
    </div>
    <button id="goClass" hidden>Go into school! 🏫</button>
  </div>

  <div id="dash">
    <div class="cluster" id="left">
      <button id="bEngine" class="btn engine" aria-label="Start or stop the engine">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><circle cx="15" cy="24" r="9"/><path d="M24 24h19M37 24v8M43 24v6"/></svg>
        <span>Engine</span></button>
      <button id="bStop" class="btn stop" aria-label="Stop">
        <svg viewBox="0 0 48 48"><polygon points="16,3 32,3 45,16 45,32 32,45 16,45 3,32 3,16" fill="#fff"/><rect x="11" y="20" width="26" height="8" rx="2" fill="#ef4444"/></svg>
        <span>Stop</span></button>
      <button id="bBack" class="btn back" aria-label="Reverse">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M40 24H10M22 11 9 24l13 13"/></svg>
        <span>Back</span></button>
      <button id="bGo" class="btn go" aria-label="Drive">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 24h30M26 11l13 13-13 13"/></svg>
        <span>Go</span></button>
    </div>

    <div id="wheelWrap">
      <div id="wheel"><svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#111318" stroke-width="10"/>
        <circle cx="50" cy="50" r="44" fill="none" stroke="#3a3f4c" stroke-width="3" stroke-dasharray="4 6"/>
        <path d="M8 50h30M62 50h30M50 62v32" stroke="#111318" stroke-width="9" stroke-linecap="round"/>
      </svg></div>
      <button id="bHorn" aria-label="Beep the horn">BEEP</button>
    </div>

    <div class="cluster" id="right">
      <button id="bOpen" class="btn door" aria-label="Open the doors">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="36" height="38" rx="3"/><path d="M21 24H11M15 19l-5 5 5 5M27 24h10M33 19l5 5-5 5"/></svg>
        <span>Open</span></button>
      <button id="bClose" class="btn door" aria-label="Close the doors">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="36" height="38" rx="3"/><path d="M24 9v30M10 24h9M15 19l5 5-5 5M38 24h-9M33 19l-5 5 5 5"/></svg>
        <span>Close</span></button>
      <button id="bWipers" class="btn wipers" aria-label="Wipers on or off">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M9 9h30l5 31H4z"/><path d="M24 37 12 17" stroke-width="5"/><circle cx="24" cy="37" r="2.5" fill="currentColor"/><path d="M34 17c0 2-1.3 3.4-3 3.4s-3-1.4-3-3.4 3-6 3-6 3 4 3 6zM38 30c0 1.8-1.2 3-2.7 3s-2.7-1.2-2.7-3 2.7-5.4 2.7-5.4 2.7 3.6 2.7 5.4z" fill="currentColor" stroke="none"/></svg>
        <span>Wipers</span></button>
      <div class="radioCell">
        <button id="bRadio" class="btn radio" aria-label="Radio on or off">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><rect x="5" y="17" width="38" height="26" rx="5"/><circle cx="17" cy="30" r="6"/><path d="M29 25h9M29 30h9M29 35h9M12 17 34 6"/></svg>
          <span>Radio</span></button>
        <button id="bNext" aria-label="Next song"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4l10 8-10 8zM12 4l9 8-9 8z"/></svg></button>
      </div>
    </div>
  </div>
</div>

<div id="title">
  <div class="card">
    <h1>Bus Driver</h1>
    <p>Pick up the kids and take them to school!</p>
    <p id="starLine"></p>
    <div id="swatches" aria-label="Choose your bus"></div>
    <button id="play">Play ▶</button>
  </div>
</div>

<div id="school" hidden>
  <div id="classScreen" class="screen">
    <canvas id="classCanvas" aria-label="A classroom: the class at their tables and the teacher by the whiteboard"></canvas>
    <div class="paper" id="menuPaper">
      <h2 id="menuHello">Today’s work</h2>
      <div class="tasks">
        <button class="task main" id="tName"><span class="ico">✏️</span><span>My name<small id="tNameSub">Kellan</small></span></button>
        <button class="task main" id="tCount"><span class="ico">🧒</span><span>Count the kids<small>1, 2, 3…</small></span></button>
        <button class="task main" id="tTrace"><span class="ico">🔢</span><span>Colour numbers<small id="tTraceSub">1, 2, 3</small></span></button>
        <button class="task" id="tBook"><span class="ico">⭐</span><span>My star book</span></button>
        <button class="task wide" id="tBus"><span class="ico">🚌</span><span>Home time<small>Back to the bus</small></span></button>
      </div>
    </div>
  </div>
  <div id="traceScreen" class="screen" hidden>
    <div class="topbar">
      <button class="round" id="trBack" aria-label="Back to my desk">✕</button>
      <div id="nameStrip"></div>
      <button class="round" id="trSay" aria-label="Hear the sound again">🔊</button>
    </div>
    <div id="traceWrap">
      <canvas id="traceCanvas" aria-label="Colour in the letter"></canvas>
      <div id="countRow" hidden></div>
      <div id="soundCard" hidden><div class="pic"></div><div class="lt"></div><div class="wd"></div></div>
    </div>
    <div id="crayons"></div>
  </div>
  <div id="countScreen" class="screen" hidden>
    <div class="topbar">
      <button class="round" id="cBack" aria-label="Back to my desk">✕</button>
      <div id="countHead"><div id="countPrompt">Tap each one to count!</div><div id="roundDots"></div></div>
      <button class="round" id="cSay" aria-label="Hear it again">🔊</button>
    </div>
    <div id="countArea"></div>
    <div id="choices" hidden></div>
  </div>
  <div id="bookScreen" class="screen" hidden>
    <div class="book">
      <div class="page left"><h2 id="bookTitle">Star Book</h2><p id="bookCount"></p></div>
      <div class="page" id="bookStars"></div>
    </div>
    <button id="bookBack" class="bigBtn">Back to my desk</button>
  </div>
</div>

<script src="js/songs.js?v=4"></script>
<script src="js/sound.js?v=4"></script>
<script src="js/scene.js?v=4"></script>
<script src="js/school.js?v=4"></script>
<script src="js/game.js?v=4"></script>
</body>
</html>
