<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover art</title>
<!-- Store covers from a clean game frame plus the game's logo. tools/covers.js screenshots it:
     cover-art.html?game=boxing&img=../promo/art.jpg&w=1920&h=1080&cx=0.5&cy=0.55&zoom=1
     cx/cy: the point of the frame to centre on (0-1), zoom: how far to crop in. Serve over http. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&display=block">
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #wrap { position: relative; overflow: hidden; }
  canvas { display: block; }
  .logo { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap; margin: 0; font-weight: 400; }
  /* Bare Knuckle: bone white Anton with a heavy black edge and a blood-red bar, like the title screen */
  .boxing .logo { font-family: "Anton", Impact, sans-serif; color: #efe6d2; letter-spacing: .02em; line-height: .95;
    -webkit-text-stroke: .07em #0d0908; paint-order: stroke fill; text-shadow: 0 .05em 0 #0d0908, 0 .1em .35em rgba(0,0,0,.7); }
  .boxing .logo .bar { display: block; height: .09em; margin: .1em auto 0; width: 86%; background: #b3202a; box-shadow: 0 .03em 0 #0d0908; }
  .boxing .logo small { display: block; font: 700 .2em "Barlow Condensed", Arial, sans-serif; letter-spacing: .5em; padding-left: .5em; color: #d9a441; -webkit-text-stroke: 0; margin-top: .35em; }
  /* Road Rumble: skewed Anton, ROAD in amber, as on the title screen */
  .road .logo { font-family: "Anton", Impact, sans-serif; color: #f2ede4; line-height: .88; transform: translateX(-50%) skewX(-8deg);
    text-shadow: 0 .04em 0 #000, 0 0 .4em rgba(255,90,31,.45); -webkit-text-stroke: .025em #000; paint-order: stroke fill; }
  .road .logo span { color: #ffb300; display: block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas><h1 class="logo" id="logo"></h1></div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080), game = q.get('game') || 'boxing';
  const cx = +(q.get('cx') || 0.5), cy = +(q.get('cy') || 0.5), zoom = +(q.get('zoom') || 1);
  document.body.className = game;
  const wrap = document.getElementById('wrap'); wrap.style.cssText = `width:${W}px;height:${H}px`;
  const cv = document.getElementById('cv'), c = cv.getContext('2d'); cv.width = W; cv.height = H;
  const img = new Image(); img.src = q.get('img'); await img.decode();
  // crop: cover the canvas, zoomed, centred on (cx, cy) but never past the frame's edges
  const s = Math.max(W / img.width, H / img.height) * zoom, sw = W / s, sh = H / s;
  const sx = Math.min(img.width - sw, Math.max(0, cx * img.width - sw / 2)), sy = Math.min(img.height - sh, Math.max(0, cy * img.height - sh / 2));
  c.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  // darken where the logo sits (the bottom, or the sky for Road Rumble), and the edges
  const top = game === 'road';
  const g = top ? c.createLinearGradient(0, H * 0.45, 0, 0) : c.createLinearGradient(0, H * 0.45, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, top ? 'rgba(10,6,20,0.55)' : 'rgba(0,0,0,0.78)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const v = c.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); c.fillStyle = v; c.fillRect(0, 0, W, H);

  const logo = document.getElementById('logo'), u = Math.min(W, H), wide = W / H > 1.3;
  if (game === 'boxing') logo.innerHTML = 'BARE KNUCKLE<span class="bar"></span><small>BOXING</small>';
  else logo.innerHTML = '<span>ROAD</span>RUMBLE';
  const size = game === 'boxing' ? (wide ? 0.17 * H : 0.165 * W) : (wide ? 0.16 * H : 0.18 * W);
  logo.style.fontSize = size + 'px';
  if (top) logo.style.top = (wide ? 0.06 : 0.05) * H + 'px'; else logo.style.bottom = (wide ? 0.07 : 0.06) * H + 'px';
  await document.fonts.ready;
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
