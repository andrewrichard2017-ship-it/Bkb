<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Road Rumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  :root { color-scheme: dark; --ink: #f2ede4; --dim: #a59f96; --acc: #ffb300; --acc2: #ff5a1f; --bg: #0f0f12; --panel: rgba(16,16,20,.86); --line: rgba(255,255,255,.12);
    --hd: "Anton", Impact, "Arial Narrow Bold", sans-serif; --ui: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: var(--ui); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); font: 400 clamp(22px, 4vw, 40px) var(--hd); letter-spacing: .04em; color: var(--acc); z-index: 50; }

  /* ---------------- menus ---------------- */
  #menu { position: fixed; inset: 0; display: none; z-index: 20; overflow-y: auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #menu.show { display: grid; place-items: center; }
  #menu.over-attract { background: linear-gradient(90deg, rgba(8,8,10,.82) 0%, rgba(8,8,10,.45) 48%, rgba(8,8,10,0) 75%); place-items: center start; }
  #menu.dim { background: rgba(0,0,0,.45); }
  #menu.garage { place-items: center end; background: linear-gradient(270deg, rgba(8,8,10,.7), rgba(8,8,10,0) 55%); }
  .title { padding: 0 clamp(8px, 5vw, 70px); max-width: 560px; }
  .title h1 { margin: 0; font: 400 clamp(54px, 11vw, 120px)/.88 var(--hd); letter-spacing: .01em; transform: skewX(-8deg); text-shadow: 0 4px 0 #000, 0 0 40px rgba(255,90,31,.35); }
  .title h1 span { color: var(--acc); display: block; }
  .tag { margin: 10px 0 22px; font-size: clamp(16px, 2.4vw, 22px); color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
  .foot { margin-top: 18px; font-size: 16px; color: var(--dim); }
  .pad.on { color: #7cff8a; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .mi { font: 700 clamp(17px, 2.4vw, 22px)/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); text-align: left;
    background: rgba(255,255,255,.06); border: 1px solid var(--line); border-left: 4px solid var(--acc2); padding: 12px 16px; border-radius: 4px; cursor: pointer;
    transition: transform .08s, background .08s; touch-action: manipulation; }
  .mi:hover { background: rgba(255,255,255,.12); }
  .mi.focus { background: var(--acc); color: #111; border-color: var(--acc); transform: translateX(4px); box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 24px rgba(255,179,0,.35); }
  .mi[disabled] { opacity: .35; cursor: default; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: clamp(14px, 2.6vw, 26px); width: min(560px, 100%); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .panel.wide { width: min(980px, 100%); }
  .panel.side { width: min(420px, 100%); margin-right: clamp(0px, 3vw, 40px); }
  .panel.small-panel { width: min(360px, 100%); }
  .hdr { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px; }
  .hdr h2 { margin: 0; font: 400 clamp(30px, 5vw, 46px)/1 var(--hd); letter-spacing: .02em; transform: skewX(-6deg); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips span { font-weight: 700; font-size: 16px; letter-spacing: .05em; padding: 4px 10px; border-radius: 3px; background: rgba(255,255,255,.08); }
  .chips .money, .price { color: #7cff8a; }
  .sub { color: var(--dim); font-size: 18px; margin: 8px 0 12px; line-height: 1.25; }
  .sub.small { font-size: 15px; margin-top: 14px; }
  .tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  .card { display: flex; flex-direction: column; gap: 6px; min-height: 120px; border-left-width: 1px; background-size: cover; position: relative; }
  .card b { font: 400 22px/1 var(--hd); letter-spacing: .03em; }
  .card small { font: 500 14px/1.15 var(--ui); text-transform: none; letter-spacing: 0; opacity: .85; }
  .card em { font-style: normal; font-size: 14px; margin-top: auto; color: var(--acc); }
  .card.focus em { color: #111; }
  .card.picked { outline: 2px solid var(--acc); }
  .th-coast { background-image: linear-gradient(160deg, rgba(47,109,181,.55), rgba(246,207,160,.25)); }
  .th-forest { background-image: linear-gradient(160deg, rgba(36,72,43,.7), rgba(185,202,216,.2)); }
  .th-valley { background-image: linear-gradient(160deg, rgba(111,156,58,.55), rgba(216,236,248,.2)); }
  .th-desert { background-image: linear-gradient(160deg, rgba(164,85,58,.65), rgba(255,185,119,.25)); }
  .th-city { background-image: linear-gradient(160deg, rgba(11,16,48,.9), rgba(216,116,63,.35)); }
  .selector { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 240px; border-left-width: 1px; }
  .selector b { font: 400 22px/1 var(--hd); letter-spacing: .03em; }
  .selector span { opacity: .6; }
  .selector.ro { padding: 12px 16px; border: 1px solid var(--line); border-radius: 4px; background: rgba(255,255,255,.04); }
  .blurb { font-size: 18px; color: var(--dim); margin: 10px 0; line-height: 1.25; }
  .stat { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 10px; margin: 6px 0; font-weight: 700; font-size: 14px; letter-spacing: .08em; color: var(--dim); }
  .stat div { height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; }
  .stat i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc2), var(--acc)); }
  .specline { margin-top: 8px; font-weight: 700; letter-spacing: .06em; }
  .price { font: 400 30px var(--hd); margin-top: 10px; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 8px; }
  .pcard { border: 1px solid var(--line); border-radius: 6px; padding: 12px; background: rgba(255,255,255,.03); }
  .pcard h3 { margin: 0; font: 400 26px var(--hd); letter-spacing: .03em; }
  .pcard.p1 h3 { color: var(--acc); } .pcard.p2 h3 { color: #00e5ff; }
  .pcard small { display: block; color: var(--dim); font-size: 15px; margin: 2px 0 10px; }
  .code { font: 400 clamp(54px, 10vw, 86px)/1 var(--hd); letter-spacing: .14em; color: var(--acc); text-align: center; margin: 6px 0; }
  .link, .codein { width: 100%; font: 600 16px var(--ui); color: var(--ink); background: rgba(0,0,0,.4); border: 1px solid var(--line); padding: 10px; border-radius: 4px; -webkit-user-select: text; user-select: text; }
  .codein { font: 400 44px var(--hd); letter-spacing: .2em; text-align: center; text-transform: uppercase; }
  .status { color: #9fd3ff; font-size: 18px; min-height: 1.2em; }
  .howto h3 { font: 400 22px var(--hd); letter-spacing: .04em; margin: 0 0 6px; color: var(--acc); }
  .howto table { border-collapse: collapse; width: 100%; font-size: 17px; }
  .howto td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .howto td:first-child { font-weight: 700; white-space: nowrap; color: var(--ink); }
  .howto td:last-child { color: var(--dim); }
  .tips { font-size: 17px; color: var(--dim); line-height: 1.3; padding-left: 20px; }
  .tips b { color: var(--ink); }
  .standings { border-collapse: collapse; font-size: 17px; width: 100%; }
  .standings td { padding: 4px 8px; border-bottom: 1px solid var(--line); }
  .standings td:first-child { font: 400 20px var(--hd); width: 36px; }
  .standings tr.me { background: rgba(255,179,0,.18); color: #fff; }
  .pay div { display: flex; justify-content: space-between; font-size: 20px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .pay b { color: #7cff8a; }
  .pay .bad b { color: #ff6b6b; }
  .pay .total { font-weight: 700; }
  .pay .gold { color: var(--acc); font: 400 26px var(--hd); }

  /* ---------------- HUD ---------------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; font-family: var(--ui); }
  .view { position: absolute; overflow: hidden; }
  .view.half + .view.half { border-top: 3px solid #000; }
  .top { position: absolute; left: max(14px, env(safe-area-inset-left)); top: 10px; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .pos { font-family: var(--hd); line-height: .9; }
  .pos b { font-weight: 400; font-size: clamp(46px, 9vh, 84px); }
  .pos i { font-style: normal; font-size: clamp(18px, 3vh, 28px); vertical-align: top; margin-left: 2px; color: var(--acc); }
  .pos span { font-size: clamp(18px, 3vh, 28px); opacity: .7; margin-left: 4px; }
  .time { font: 600 clamp(15px, 2.4vh, 20px) var(--ui); letter-spacing: .05em; opacity: .85; }
  .who { position: absolute; top: 10px; right: 16px; font: 400 clamp(20px, 3.5vh, 30px) var(--hd); text-shadow: 0 2px 6px #000; }
  .prog { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: min(44%, 520px); }
  .prog .track { position: relative; height: 6px; border-radius: 3px; background: rgba(0,0,0,.45); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .prog .flag { position: absolute; right: -4px; top: -7px; width: 12px; height: 20px; background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0/8px 8px; border-radius: 2px; }
  .dot { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #bbb; box-shadow: 0 0 0 1px #000; }
  .dot.me { width: 14px; height: 14px; margin: -7px; background: var(--acc); z-index: 3; box-shadow: 0 0 0 2px #000, 0 0 10px var(--acc); }
  .dot.hum { width: 12px; height: 12px; margin: -6px; z-index: 2; }
  .dot.cop { background: #2f7bff; }
  .bl { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: 12px; width: min(260px, 36%); }
  .meter { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 8px; margin-top: 6px; font: 700 13px var(--ui); letter-spacing: .1em; text-shadow: 0 1px 3px #000; }
  .meter div { height: 12px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.3); border-radius: 2px; overflow: hidden; transform: skewX(-12deg); }
  .meter i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #36d26b, #9dff5c); transition: width .15s; }
  .meter.bikem i { background: linear-gradient(90deg, #ff9d00, #ffd54f); }
  .meter i.low { background: linear-gradient(90deg, #d9171f, #ff5050); animation: blink .5s steps(2) infinite; }
  .weapon { display: inline-block; margin-top: 8px; font: 400 18px var(--hd); letter-spacing: .06em; padding: 2px 10px; background: rgba(0,0,0,.5); border-radius: 3px; color: var(--dim); }
  .weapon.armed { color: #111; background: var(--acc); }
  .nitro { margin-top: 6px; font: 700 13px var(--ui); letter-spacing: .1em; text-shadow: 0 1px 3px #000; }
  .nitro i { display: inline-block; width: 16px; height: 10px; margin-left: 4px; border-radius: 2px; background: rgba(255,255,255,.18); vertical-align: middle; }
  .nitro i.on { background: #39c6ff; box-shadow: 0 0 8px #39c6ff; }
  .nitro.burn { color: #39c6ff; }
  .speedo { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: 8px; width: clamp(130px, 22vh, 200px); text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .speedo svg { width: 100%; display: block; overflow: visible; }
  .speedo .arc, .speedo .rpm { fill: none; stroke-width: 9; stroke-linecap: round; }
  .speedo .arc { stroke: rgba(0,0,0,.45); }
  .speedo .rpm { stroke: var(--acc); stroke-dasharray: 0 200; transition: stroke-dasharray .06s; }
  .speedo .rpm.red { stroke: #ff3b3b; }
  .speedo b { display: block; margin-top: -48%; font: 400 clamp(34px, 7vh, 58px)/1 var(--hd); }
  .speedo span { font: 700 12px var(--ui); letter-spacing: .14em; opacity: .8; }
  .speedo em { position: absolute; right: -2px; top: 0; font: 400 20px var(--hd); font-style: normal; color: var(--acc); }
  .rival { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); width: min(300px, 44%); opacity: 0; transition: opacity .2s; text-align: center; text-shadow: 0 1px 4px #000; }
  .rival.show { opacity: 1; }
  .rival label { font: 400 18px var(--hd); letter-spacing: .06em; color: #ff8a65; }
  .rival div { height: 7px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.3); }
  .rival i { display: block; height: 100%; background: #ff5a1f; transition: width .15s; }
  .copwarn { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); font: 400 22px var(--hd); letter-spacing: .12em; padding: 2px 12px; border-radius: 3px; display: none; animation: cop .5s steps(2) infinite; }
  .copwarn.show { display: block; }
  @keyframes cop { 0% { background: #d50000; } 100% { background: #2962ff; } }
  @keyframes blink { 50% { opacity: .45; } }
  .msgs { position: absolute; left: 0; right: 0; top: 30%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .msg { font: 400 clamp(22px, 4.5vh, 36px) var(--hd); letter-spacing: .05em; text-shadow: 0 3px 0 #000, 0 0 20px rgba(0,0,0,.6); animation: pop 1.8s ease-out forwards; transform-origin: center; }
  .msg.big { font-size: clamp(36px, 8vh, 72px); transform: skewX(-8deg); }
  @keyframes pop { 0% { transform: scale(1.6); opacity: 0; } 10% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  .taunt { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); font: 700 clamp(17px, 3vh, 24px) var(--ui); letter-spacing: .03em; background: rgba(0,0,0,.6); padding: 4px 12px; border-radius: 14px; opacity: 0; white-space: nowrap; }
  .taunt.go { animation: taunt 2.2s ease-out forwards; }
  @keyframes taunt { 0% { opacity: 0; } 8%, 80% { opacity: 1; } 100% { opacity: 0; } }
  .count { position: absolute; inset: 0; display: grid; place-items: center; font: 400 clamp(90px, 26vh, 220px) var(--hd); color: #fff; text-shadow: 0 6px 0 #000; opacity: 0; }
  .count.show { animation: count .9s ease-out; }
  .count.go { color: var(--acc); }
  @keyframes count { 0% { transform: scale(1.8); opacity: 0; } 15% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  .hint { position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%); font: 400 clamp(22px, 4vh, 34px) var(--hd); letter-spacing: .06em; color: var(--acc); text-shadow: 0 3px 0 #000; display: none; animation: blink .6s steps(2) infinite; white-space: nowrap; }
  .hint.show { display: block; }
  .flash { position: absolute; top: 0; bottom: 0; width: 22%; opacity: 0; }
  .flash.l { left: 0; background: linear-gradient(90deg, rgba(255,0,0,.45), transparent); }
  .flash.r { right: 0; background: linear-gradient(270deg, rgba(255,0,0,.45), transparent); }
  .flash.go { animation: flash .35s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  .tag { position: absolute; left: 0; top: 0; font: 700 14px var(--ui); letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: rgba(0,0,0,.55); color: #ffd9c7; display: none; white-space: nowrap; }
  .tag.show { display: block; }
  .tag.cop { color: #9cc3ff; }
  .tag.hum { font-size: 16px; }
  .view.half .bl { width: min(220px, 30%); }
  .score { position: absolute; right: max(16px, env(safe-area-inset-right)); top: 34px; text-align: right; text-shadow: 0 3px 0 #000; }
  .score b { display: block; font: 400 clamp(44px, 9vh, 80px)/.9 var(--hd); color: var(--acc); }
  .score span { font: 700 13px var(--ui); letter-spacing: .14em; }
  .score.bump b { animation: pop2 .35s ease-out; }
  @keyframes pop2 { 0% { transform: scale(1.6); color: #fff; } 100% { transform: scale(1); } }
  .specials { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: calc(clamp(130px, 22vh, 200px) * 0.62 + 18px); width: min(220px, 30%); }
  .view.half .specials { bottom: calc(clamp(100px, 18vh, 150px) * 0.62 + 14px); }
  .sm { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 6px; margin-top: 5px; font: 700 13px var(--ui); letter-spacing: .1em; text-shadow: 0 1px 3px #000; }
  .sm div { height: 10px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.3); border-radius: 2px; overflow: hidden; transform: skewX(-12deg); }
  .sm i { display: block; height: 100%; width: 0; transition: width .15s; }
  .sm.turbo i { background: linear-gradient(90deg, #ff5a00, #ffd000); }
  .sm.frenzy i { background: linear-gradient(90deg, #b00020, #ff4d6d); }
  .sm em { font-style: normal; font: 400 15px var(--hd); letter-spacing: .04em; min-width: 0; }
  .sm.ready label, .sm.ready em { color: #fff; animation: blink .45s steps(2) infinite; }
  .sm.turbo.ready div { box-shadow: 0 0 12px #ff8a00; } .sm.frenzy.ready div { box-shadow: 0 0 12px #ff1744; }
  .sm.on em { color: #ffd54f; }
  .view.half .speedo { width: clamp(100px, 18vh, 150px); }

  /* ---------------- touch ---------------- */
  #touch { position: fixed; inset: 0; z-index: 12; display: none; pointer-events: none; }
  #touch.show { display: block; }
  #touch .steer { position: absolute; left: 0; top: 18%; bottom: 0; width: 45%; pointer-events: auto; touch-action: none; }
  #touch .steer::after { content: "◀  DRAG TO STEER  ▶"; position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font: 700 14px var(--ui); letter-spacing: .12em; opacity: .4; white-space: nowrap; }
  #touch .btns { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: max(130px, 24vh); display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; pointer-events: auto; }
  #touch button { width: 72px; height: 62px; border-radius: 12px; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.35); color: #fff; font: 700 15px var(--ui); letter-spacing: .06em; touch-action: none; }
  #touch button.on { background: var(--acc); color: #111; }
  #touch button.sp.t { border-color: #ff8a00; } #touch button.sp.f { border-color: #ff1744; }
  #rotate { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; background: var(--bg); z-index: 60; font: 600 22px var(--ui); }
  #rotate b { display: block; font: 400 44px var(--hd); color: var(--acc); }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: grid; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Road Rumble motorbike combat racing"></canvas>
<div id="hud"></div>
<div id="touch">
  <div class="steer"></div>
  <div class="btns">
    <button data-k="l">◀ HIT</button><button data-k="kick">KICK</button><button data-k="r">HIT ▶</button>
    <button data-k="brake">BRAKE</button><button data-k="nitro">NITRO</button><button data-k="turbo" class="sp t">TURBO</button>
    <button data-k="frenzy" class="sp f">FRENZY</button>
  </div>
</div>
<div id="menu"></div>
<div id="loading">LOADING…</div>
<div id="rotate"><div><b>TURN YOUR PHONE</b>Road Rumble plays in landscape.</div></div>
<script type="module">import * as THREE from './lib/three.module.min.js?v=170'; window.THREE = THREE;</script>
<script defer src="js/core.js?v=5"></script>
<script defer src="js/data.js?v=5"></script>
<script defer src="js/audio.js?v=5"></script>
<script defer src="js/track.js?v=5"></script>
<script defer src="js/models.js?v=5"></script>
<script defer src="js/scenery.js?v=5"></script>
<script defer src="js/world.js?v=5"></script>
<script defer src="js/fx.js?v=5"></script>
<script defer src="js/rider.js?v=5"></script>
<script defer src="js/race.js?v=5"></script>
<script defer src="js/input.js?v=5"></script>
<script defer src="js/hud.js?v=5"></script>
<script defer src="js/menu.js?v=5"></script>
<script defer src="js/net.js?v=5"></script>
<script defer src="js/ads.js?v=4"></script>
<script defer src="js/main.js?v=5"></script>
</body>
</html>
